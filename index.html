<!DOCTYPE html>
<html>
<head>
    <title> To Do List </title>

        div{

            left: 500px;

            border: 2px solid black;
            margin: 20px;
        }

        input[type="button"]{
            background-color: rgb(85, 241, 85);

        </ol>
    </div>
</body>
</html>
